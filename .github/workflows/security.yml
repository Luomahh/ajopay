name: Security checks
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test local security guardrails
        run: python3 -m unittest discover -s scripts -p 'test_security_check.py'
      - name: Scan working tree and client configuration
        run: python3 scripts/security_check.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache: false
      - name: Install version-pinned Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.0
      - name: Scan all fetched Git history with redacted findings
        run: gitleaks git --redact=100 --no-banner --log-opts='--all' .
